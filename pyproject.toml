[project]
name = "kiko-knowledge-service"
version = "0.1.0"
description = "Versioned curriculum knowledge service"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "celery[redis]>=5,<6",
  "eval-type-backport>=0.2,<1; python_version < '3.10'",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2,<3",
  "pymysql>=1,<2",
  "python-multipart>=0.0.9",
  "requests>=2,<3",
  "sqlalchemy>=2,<3",
  "urllib3>=1.26,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7"]
dev = ["pre-commit>=4,<5", "ruff>=0.12,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
markers = ["mysql: requires KIKO_KNOWLEDGE_TEST_MYSQL_URL"]

[tool.coverage.run]
omit = ["app/workers/*", "app/celery_app.py"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP007", "UP017", "UP045"]
