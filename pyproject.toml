[project]
name = "kiko-knowledge-service"
version = "0.1.0"
description = "Versioned curriculum knowledge service"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=42,<45",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2,<3",
  "pymysql>=1,<2",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1,<4",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7"]
dev = ["pre-commit>=4,<5", "ruff>=0.12,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP007", "UP017", "UP045"]
